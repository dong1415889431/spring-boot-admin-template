# One-command startup: MySQL + Redis + app (completed in Week 5)
# Usage: docker compose up -d --build
# On first startup, tables are created and seed data is written automatically (schema.sql is mounted to the MySQL init directory)
services:
  mysql:
    image: mysql:8.0
    container_name: admin-template-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: admin_template
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Automatically runs table creation + seed data on first initialization
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: admin-template-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: admin-template-app
    ports:
      - "8080:8080"
    environment:
      # Inside the container, access MySQL/Redis via service names (overrides localhost in application.yml)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/admin_template?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # Replace with a long random key before going live (≥32 bytes)
      JWT_SECRET: docker-change-me-to-a-long-random-secret-key-32-bytes
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
