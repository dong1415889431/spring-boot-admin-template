server:
  port: 8080

spring:
  application:
    name: spring-boot-admin-template
  datasource:
    url: jdbc:mysql://localhost:3306/admin_template?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # password: your-redis-password
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT configuration (Week 3 authentication module)
jwt:
  # Replace with a long random key before going live (≥32 bytes)
  secret: change-me-to-a-long-random-secret-key-please-32-bytes
  # access token TTL (seconds), default 24 hours
  expiration: 86400
  # refresh token TTL (seconds), default 7 days
  refresh-expiration: 604800

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
